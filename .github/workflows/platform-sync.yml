name: platform-sync
# Syncs the FlxioAI Vision app overlay to the Higgsfield platform repo and
# pushes it to main (the platform CI then builds the live deploy).
# Requires repo secret PLATFORM_TOKEN (scoped deploy token for the platform repo).

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to platform repo after checks pass (false = dry run)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: platform-sync
  cancel-in-progress: false

env:
  PLATFORM_REPO: apps-repos.higgsfield.ai/hfu-user3EBuQb4r6RDvs1kC4Tr4FwmRtWL/flxiovision-39028a4b-2ab6-4c44-aacd-835176a0c151.git

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check secret present
        run: |
          if [ -z "${{ secrets.PLATFORM_TOKEN }}" ]; then
            echo "::error::PLATFORM_TOKEN secret is not set (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          ref: claude/saas-product-rebuild-sy45qb
          path: overlay

      - name: Clone platform repo
        run: |
          git -c http.extraHeader="Authorization: token ${{ secrets.PLATFORM_TOKEN }}" \
            clone "https://${PLATFORM_REPO}" platform
          echo "platform HEAD: $(git -C platform rev-parse --short HEAD)"

      - name: Apply overlay + template patches
        run: python3 overlay/flxio-vision/scripts/ci-overlay.py overlay/flxio-vision/app platform/app

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: platform/app
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        working-directory: platform/app
        run: bun run typecheck

      - name: Placeholder gate (qa:fill)
        working-directory: platform/app
        run: bun run qa:fill -- --strict || { echo "::warning::qa:fill reported findings (see above)"; exit 1; }

      - name: Commit and push to platform main
        if: ${{ github.event.inputs.push != 'false' }}
        working-directory: platform
        run: |
          git add -A
          git -c user.name="FlxioAI Vision CI" -c user.email="ci@flxiovision.local" \
            commit -m "FlxioAI Vision: product overlay (studio, billing, SEO, share pages)" || { echo "nothing to commit"; exit 0; }
          git -c http.extraHeader="Authorization: token ${{ secrets.PLATFORM_TOKEN }}" push origin main
          echo "pushed: $(git rev-parse --short HEAD)"
