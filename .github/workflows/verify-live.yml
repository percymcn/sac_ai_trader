name: verify-live
# Step-8 verification of the live FlxioAI Vision deploy. Curls every money
# page and prints status codes + key SEO tags so the session can read the
# evidence from job logs. Zero third-party actions.
on:
  push:
    paths:
      - ".github/workflows/verify-live.yml"
      - ".verify-trigger"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site
        run: |
          BASE="https://flxiovision.higgsfield.app"
          C="curl -s --compressed --max-time 30"
          paths="/ /pricing /features /use-cases /about /contact /blog /explore /studio /billing /vs /vs/runway /vs/kling /best/higgsfield-alternative /best/ai-video-generator /use-cases/music-artists /blog/higgsfield-alternatives-tested /answers /presets /models /sitemap.xml /robots.txt /r/nonexistent-id"
          echo "== STATUS CODES =="
          for p in $paths; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$BASE$p")
            echo "$code  $p"
          done

          echo "== HOMEPAGE HEAD =="
          $C "$BASE/" | tr '>' '>\n' | grep -iE '<title|og:|twitter:|name="description"|canonical' | head -30 || true

          echo "== HOMEPAGE JSON-LD =="
          $C "$BASE/" | grep -o '<script type="application/ld+json">[^<]*' | cut -c41-340 || true

          echo "== SITEMAP URL COUNT =="
          $C "$BASE/sitemap.xml" | grep -c '<loc>' || true

          echo "== SITEMAP SAMPLE =="
          $C "$BASE/sitemap.xml" | grep '<loc>' | sed -n '1p;20p;40p;60p;80p;100p;120p'

          echo "== ROBOTS.TXT (tail) =="
          $C "$BASE/robots.txt" | tail -10

          echo "== PRICING TITLE =="
          $C "$BASE/pricing" | tr '>' '>\n' | grep -iE '<title|"description"' | head -4 || true

          echo "== VS RUNWAY TITLE =="
          $C "$BASE/vs/runway" | tr '>' '>\n' | grep -iE '<title' | head -2 || true

          echo "== BEST PAGE TITLE =="
          $C "$BASE/best/higgsfield-alternative" | tr '>' '>\n' | grep -iE '<title' | head -2 || true

          echo "== BLOG POST TITLE =="
          $C "$BASE/blog/higgsfield-alternatives-tested" | tr '>' '>\n' | grep -iE '<title' | head -2 || true

          echo "== R PAGE (nonexistent) BODY SNIPPET =="
          $C "$BASE/r/nonexistent-id" | tr '>' '>\n' | grep -iE '<title|not.?found|noindex' | head -5 || true

          echo "== TRAILING SLASH REDIRECT =="
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" --max-time 30 "$BASE/pricing/"

          echo "== AUTH LOGIN REDIRECT =="
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" --max-time 30 "$BASE/__auth/login"

          echo "== API USER (signed out) =="
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 "$BASE/api/user"

          echo "== 404 PAGE =="
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 "$BASE/this-page-does-not-exist"

          echo "== MOBILE VIEWPORT META =="
          $C "$BASE/" | grep -o 'name="viewport"[^>]*' | head -1 || true

          echo "VERIFY_DONE"
