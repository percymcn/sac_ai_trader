name: verify-live
# Step-8 verification of the live FlxioAI Vision deploy. Curls every money
# page and prints status codes + key SEO tags so the session can read the
# evidence from job logs. Zero third-party actions.
on:
  push:
    paths:
      - ".github/workflows/verify-live.yml"
      - ".verify-trigger"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site
        run: |
          BASE="https://flxiovision.higgsfield.app"
          paths="/ /pricing /features /use-cases /about /contact /blog /explore /studio /billing /vs /vs/runway /vs/kling /best/higgsfield-alternative /best/ai-video-generator /use-cases/music-videos /blog/higgsfield-alternatives /answers /presets /sitemap.xml /robots.txt /r/nonexistent-id /login"
          echo "== STATUS CODES =="
          fail=0
          for p in $paths; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$BASE$p")
            echo "$code  $p"
          done

          echo "== HOMEPAGE HEAD =="
          curl -s --max-time 30 "$BASE/" | tr '>' '>\n' | grep -iE '<title|og:|twitter:|description|canonical|ld\+json' | head -40 || true

          echo "== HOMEPAGE JSON-LD =="
          curl -s --max-time 30 "$BASE/" | grep -o '<script type="application/ld+json">[^<]*' | head -5 | cut -c1-400 || true

          echo "== SITEMAP (first 30 lines) =="
          curl -s --max-time 30 "$BASE/sitemap.xml" | head -30

          echo "== SITEMAP URL COUNT =="
          curl -s --max-time 30 "$BASE/sitemap.xml" | grep -c '<loc>' || true

          echo "== ROBOTS.TXT =="
          curl -s --max-time 30 "$BASE/robots.txt"

          echo "== PRICING HEAD =="
          curl -s --max-time 30 "$BASE/pricing" | tr '>' '>\n' | grep -iE '<title|description"|canonical' | head -6 || true

          echo "== VS RUNWAY: title + h1-ish =="
          curl -s --max-time 30 "$BASE/vs/runway" | tr '>' '>\n' | grep -iE '<title|og:title' | head -4 || true

          echo "== TRAILING SLASH REDIRECT CHECK =="
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" --max-time 30 "$BASE/pricing/"

          echo "== AUTH LOGIN REDIRECT =="
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" --max-time 30 "$BASE/__auth/login"

          echo "== API USER (signed out) =="
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 "$BASE/api/user"

          echo "== 404 PAGE =="
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 "$BASE/this-page-does-not-exist"

          echo "VERIFY_DONE"
