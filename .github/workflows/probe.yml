name: probe
on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Quanta component APIs
        env:
          TOKEN: ${{ secrets.PLATFORM_TOKEN }}
        run: |
          set -e
          git -c http.extraHeader="Authorization: token ${TOKEN}" clone --depth 1 "https://apps-repos.higgsfield.ai/hfu-user3EBuQb4r6RDvs1kC4Tr4FwmRtWL/flxiovision-39028a4b-2ab6-4c44-aacd-835176a0c151.git" p
          A=p/app/packages/quanta/ai/AGENTS.md
          for c in Tabs Select Dropdown Switch RadioGroup; do
            echo "======== $c API ref ========"
            grep -n "\*\*\`$c\`\*\*" "$A" | head
            grep -n -A3 "\*\*\`$c\`\*\*" "$A" | head -12
          done
          echo "======== EXAMPLE BLOCKS (### Tabs / ### Select / ### Dropdown) ========"
          awk '/^### (Tabs|Select|Dropdown|Switch|Radio)/{f=1} f{print NR": "$0} /^### /{if(f && $0 !~ /Tabs|Select|Dropdown|Switch|Radio/)f=0}' "$A" | head -140
