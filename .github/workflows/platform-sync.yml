name: platform-sync
# Overlays the FlxioAI Vision app onto the Higgsfield platform repo and pushes
# to its main, which triggers the platform's live build. Uses ZERO third-party
# actions (the ping test proved GitHub-owned/no-action jobs run here) — the
# source is cloned with the built-in GITHUB_TOKEN and bun is installed via curl.
# Requires repo secret PLATFORM_TOKEN.
on:
  push:
    branches:
      - claude/saas-product-rebuild-sy45qb
    paths:
      - "flxio-vision/**"
      - ".github/workflows/platform-sync.yml"
      - ".deploy-trigger"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Higgsfield platform
        env:
          TOKEN: ${{ secrets.PLATFORM_TOKEN }}
          GH: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "PLATFORM_TOKEN secret not set — nothing to do."
            exit 0
          fi
          PLAT="apps-repos.higgsfield.ai/hfu-user3EBuQb4r6RDvs1kC4Tr4FwmRtWL/flxiovision-39028a4b-2ab6-4c44-aacd-835176a0c151.git"

          echo "::group::clone source (this repo)"
          git clone --depth 1 -b "$REF" "https://x-access-token:${GH}@github.com/${REPO}.git" ovl
          echo "::endgroup::"

          echo "::group::install bun"
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          echo "::endgroup::"

          echo "::group::clone platform repo"
          git -c http.extraHeader="Authorization: token ${TOKEN}" clone "https://${PLAT}" platform
          echo "::endgroup::"

          echo "::group::overlay app"
          python3 ovl/flxio-vision/scripts/ci-overlay.py ovl/flxio-vision/app platform/app
          echo "::endgroup::"

          echo "::group::typecheck"
          ( cd platform/app && bun install && (bun run typecheck || echo "::warning::typecheck reported issues — deploying anyway; review logs") )
          echo "::endgroup::"

          echo "::group::commit + push to platform main"
          cd platform
          git add -A
          if git -c user.name="flxio-ci" -c user.email="ci@flxiovision.local" commit -m "FlxioAI Vision: full product overlay"; then
            git -c http.extraHeader="Authorization: token ${TOKEN}" push origin main
            echo "PUSHED_TO_PLATFORM"
          else
            echo "no changes to push (platform already up to date)"
          fi
          echo "::endgroup::"
